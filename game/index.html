<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bright Hollow</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a2b22; overflow:hidden; touch-action:none; }
  #game { display:block; width:100vw; height:100vh; image-rendering:pixelated; }
  #hud { position:fixed; top:8px; left:8px; right:8px; display:flex; gap:6px; align-items:flex-start; z-index:10; pointer-events:none; }
  .hudbox { background:rgba(16,20,16,0.82); border:2px solid #3a4a3a; border-radius:8px; padding:6px 8px; color:#e8e2d0; font-family:monospace; font-size:13px; pointer-events:auto; }
  #hpwrap { min-width:130px; }
  #hpbar-bg { background:#40232a; height:10px; border-radius:5px; overflow:hidden; margin-top:3px; }
  #hpbar { background:#e05a5a; height:100%; width:100%; }
  #quests { margin-top:4px; font-size:11px; line-height:1.5; }
  .qitem { color:#e8c96a; }
  .qitem span { color:#b8b2a0; }
  .qitem.done { color:#7bc96f; text-decoration:none; }
  .hbtn { cursor:pointer; user-select:none; }
  .hbtn:active { background:rgba(60,80,60,0.9); }
  #toasts { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:20; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; width:min(92vw, 420px); }
  .toast { background:rgba(16,20,16,0.92); border:2px solid #3a4a3a; border-radius:8px; padding:8px 12px; color:#e8e2d0; font-family:monospace; font-size:13px; text-align:center; transition:opacity .5s; max-width:100%; }
  .toast.warn { border-color:#8a7a3a; color:#f0dc9a; }
  .toast.item { border-color:#3a6a4a; color:#b8e6c0; }
  .toast.loot { border-color:#6a5aaa; color:#d0c2ff; }
  .toast.quest { border-color:#8a6a2a; color:#ffd98a; }
  .toast.build { border-color:#3a5a8a; color:#a8c8ff; }
  .toast.level { border-color:#caa53a; color:#ffe08a; font-weight:bold; }
  .toast.bad { border-color:#8a3a3a; color:#ff9a9a; }
  .toast.out { opacity:0; }
  #modal { position:fixed; inset:0; background:rgba(6,10,8,0.6); z-index:30; display:none; align-items:center; justify-content:center; padding:14px; }
  .panel { background:#20281f; border:3px solid #4a5a42; border-radius:12px; padding:14px; color:#e8e2d0; font-family:monospace; font-size:13px; max-width:440px; width:100%; max-height:78vh; overflow-y:auto; position:relative; }
  .panel h3 { margin:0 0 8px; color:#ffd98a; font-size:15px; }
  .panel .sub { color:#9aa08e; font-size:11px; line-height:1.5; margin-bottom:8px; }
  .panel .lore { color:#c8c2ae; line-height:1.6; font-size:12px; background:#1a211a; padding:8px; border-radius:6px; border-left:3px solid #6a7a5a; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid #2a332a; }
  .row:last-of-type { border-bottom:none; }
  .btn { background:#3a4a3a; color:#e8e2d0; border:1px solid #5a6a52; border-radius:6px; padding:6px 10px; font-family:monospace; font-size:12px; cursor:pointer; white-space:nowrap; }
  .btn:active { background:#5a6a52; }
  .btn.off { opacity:0.45; }
  .xbtn { position:absolute; top:8px; right:8px; background:#3a2020; color:#e8b0b0; border:1px solid #6a3a3a; border-radius:6px; width:26px; height:26px; font-family:monospace; cursor:pointer; }
  .mat { display:flex; align-items:center; gap:6px; }
  .icon { width:20px; height:20px; image-rendering:pixelated; vertical-align:middle; }
  .gearitem { border:2px solid #555; border-radius:8px; padding:6px 8px; margin:6px 0; display:grid; grid-template-columns:1fr auto; gap:2px 8px; }
  .gearitem.empty { opacity:0.5; }
  .gname { font-weight:bold; }
  .gstat { color:#9aa08e; font-size:11px; grid-column:1; }
  .gflav { color:#7d8478; font-size:10px; font-style:italic; grid-column:1; }
  .gact { grid-column:2; grid-row:1 / span 3; display:flex; flex-direction:column; gap:4px; }
  .skillrow { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; padding:3px 0; }
  .skbar { background:#1a211a; border-radius:4px; height:10px; overflow:hidden; }
  .skbar div { background:#7bc96f; height:100%; }
  .skxp { color:#9aa08e; font-size:10px; }
  .statline { color:#ffd98a; padding:4px 0; }
  #floats { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #help { position:fixed; left:8px; bottom:8px; z-index:10; color:#c8c2ae; font-family:monospace; font-size:10px; background:rgba(16,20,16,0.6); padding:4px 8px; border-radius:6px; }
</style>
</head>

<canvas id="game"></canvas>
<div id="hud">
  <div class="hudbox" id="hpwrap">HP <span id="hptext"></span> &middot; coins <span id="coins">0</span><div id="hpbar-bg"><div id="hpbar"></div></div><div id="quests"></div></div>
  <div style="flex:1"></div>
  <div class="hudbox hbtn" id="bagbtn">🎒</div>
  <div class="hudbox hbtn" id="gearbtn">⚔</div>
  <div class="hudbox hbtn" id="skillsbtn">Skills</div>
  <div class="hudbox hbtn" id="savebtn">💾</div>
</div>
<div id="floats"></div>
<div id="toasts"></div>
<div id="modal"></div>
<div id="help">click to walk · click trees/rocks/bushes/pond/plots to work · talk to the folk · 💾 saves</div>

<script>

"use strict";
/* Bright Hollow v0.1 - a click-to-move fantasy sandbox RPG prototype
   Built for Joe by Fo, Tue 24 Nov 2026. All data local, saves in this browser. */

var TILE = 16, SCALE = 3, TS = TILE * SCALE;   // 48 px tiles on screen
var MAPW = 48, MAPH = 48;
var HOME = { x: 24, y: 26 };

var IMG = {};        // sprite images by name
var T = {};          // canvas contexts

// ---------- small helpers ----------
function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(x1, y1, x2, y2) { return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2)); } // chebyshev
function euc(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
function chance(p) { return Math.random() < p; }
function pick(arr) { return arr[ri(0, arr.length - 1)]; }

// ---------- XP / skills ----------
var SKILLS = ["woodcutting", "mining", "farming", "foraging", "fishing", "cooking", "combat"];
var SKILL_LABEL = { woodcutting: "Woodcutting", mining: "Mining", farming: "Farming", foraging: "Foraging", fishing: "Fishing", cooking: "Cooking", combat: "Combat" };
function xpNeed(l) { return Math.floor(35 * Math.pow(l, 1.55)); }

// ---------- world data ----------
var terr = [];        // terrain tile id per cell
var objects = [];     // world objects: {id,type,x,y,state...}
var blocked = [];     // boolean per cell
var nextObjId = 1;

var TERR = { GRASS1: 0, GRASS2: 1, GDARK1: 2, GDARK2: 3, PATH: 4, WATER: 5, TILLED: 6, FLOWERS: 7, TALL: 8, DIRT: 9 };
var TERR_IMG = ["grass1", "grass2", "grassd1", "grassd2", "path", "water", "tilled", "flowers", "tallgrass", "dirtspot"];

function tIdx(x, y) { return y * MAPW + x; }
function inMap(x, y) { return x >= 0 && y >= 0 && x < MAPW && y < MAPH; }
function terrainAt(x, y) { return terr[tIdx(x, y)]; }
function setTerr(x, y, id) { terr[tIdx(x, y)] = id; }

function isBlocked(x, y) {
    if (!inMap(x, y)) return true;
    if (blocked[tIdx(x, y)]) return true;
    var t = terrainAt(x, y);
    if (t === TERR.WATER) return true;
    return false;
}

function addObj(o) {
    o.id = nextObjId++;
    objects.push(o);
    if (o.solid) blocked[tIdx(o.x, o.y)] = true;
    return o;
}
function objAt(x, y) {
    for (var i = 0; i < objects.length; i++) { var o = objects[i]; if (o.x === x && o.y === y && !o.dead) return o; }
    return null;
}
function objById(id) { for (var i = 0; i < objects.length; i++) if (objects[i].id === id) return objects[i]; return null; }

// deterministic pseudo random for map gen
function mulberry(seed) {
    return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function genMap() {
    var R = mulberry(20261124);
    for (var y = 0; y < MAPH; y++) for (var x = 0; x < MAPW; x++) {
        var dHome = euc(x, y, HOME.x, HOME.y);
        var id = (R() < 0.5) ? TERR.GRASS1 : TERR.GRASS2;
        if (dHome > 13) id = (R() < 0.5) ? TERR.GDARK1 : TERR.GDARK2;
        else if (dHome > 10 && R() < 0.4) id = (R() < 0.5) ? TERR.GDARK1 : TERR.GDARK2;
        if (R() < 0.02 && id !== TERR.GDARK1 && id !== TERR.GDARK2) id = TERR.FLOWERS;
        if (R() < 0.03) id = TERR.TALL;
        setTerr(x, y, id);
    }
    // pond SW of home
    for (var y2 = 30; y2 <= 35; y2++) for (var x2 = 10; x2 <= 16; x2++) {
        if (euc(x2, y2, 13, 32.5) < 3.2) setTerr(x2, y2, TERR.WATER);
    }
    // paths through camp
    for (var x3 = 14; x3 <= 34; x3++) setTerr(x3, 26, TERR.PATH);
    for (var y3 = 16; y3 <= 38; y3++) setTerr(24, y3, TERR.PATH);
    // border rocks (impassable)
    for (var x4 = 0; x4 < MAPW; x4++) { blocked[tIdx(x4, 0)] = true; blocked[tIdx(x4, MAPH - 1)] = true; }
    for (var y4 = 0; y4 < MAPH; y4++) { blocked[tIdx(0, y4)] = true; blocked[tIdx(MAPW - 1, y4)] = true; }
    // cave rock walls NE
    for (var y5 = 2; y5 <= 12; y5++) for (var x5 = 34; x5 <= 46; x5++) {
        if (euc(x5, y5, 40, 7) < 5.5) { blocked[tIdx(x5, y5)] = true; }
    }
    blocked[tIdx(40, 11)] = false; // mouth front clear
    setTerr(40, 11, TERR.PATH);
}

// ---------- object placement ----------
function placeWorld() {
    // camp core (tier 1)

// ---------- pathfinding (BFS) ----------
function findPath(sx, sy, gx, gy) {
    if (!inMap(gx, gy) || isBlocked(gx, gy)) return null;
    var prev = {}, seen = {}; var q = [[sx, sy]]; seen[tIdx(sx, sy)] = true;
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (q.length) {
        var cur = q.shift();
        if (cur[0] === gx && cur[1] === gy) {
            var path = []; var c = cur;
            while (!(c[0] === sx && c[1] === sy)) { path.push([c[0], c[1]]); c = prev[tIdx(c[0], c[1])]; }
            path.reverse(); return path;
        }
        for (var d = 0; d < 4; d++) {
            var nx = cur[0] + dirs[d][0], ny = cur[1] + dirs[d][1];
            if (!inMap(nx, ny) || seen[tIdx(nx, ny)] || isBlocked(nx, ny)) continue;
            seen[tIdx(nx, ny)] = true; prev[tIdx(nx, ny)] = cur; q.push([nx, ny]);
        }
    }
    return null;
}
function adjacentTo(px, py, ox, oy) { return dist(Math.floor(px), Math.floor(py), ox, oy) <= 1 && !(Math.floor(px) === ox && Math.floor(py) === oy); }
function walkTile(x, y) { return !isBlocked(x, y); }
function nearestAdjacent(ox, oy) {
    var best = null, bd = 1e9;
    var cand = [[ox + 1, oy], [ox - 1, oy], [ox, oy + 1], [ox, oy - 1]];
    for (var i = 0; i < cand.length; i++) {
        var c = cand[i];
        if (!walkTile(c[0], c[1])) continue;
        var p = findPath(Math.floor(player.x), Math.floor(player.y), c[0], c[1]);
        if (p && p.length < bd) { bd = p.length; best = p; }
    }
    return best;
}

function enemyTurn(dt) {

    var e = objects[i];

    var d = euc(e.x + 0.5, e.y + 0.5, player.x, player.y);

      e.aggro = true;

        var dx = Math.sign(player.x - (e.x + 0.5)), dy = Math.sign(player.y - (e.y + 0.5));
        var nx = e.x, ny = e.y;
        if (Math.abs(player.x - (e.x + 0.5)) > Math.abs(player.y - (e.y + 0.5))) nx += dx; else ny += dy;
        if (!isBlocked(nx, ny)) { e.x = nx; e.y = ny; }
      } else {

          var st = gearStats();

// ---------- rendering ----------
var canvas, ctx;
var camX = 0, camY = 0;
var SPR = {};
var floats = [];   // floating texts {x,y,text,color,t}
var toastsEl;

function loadSprites(next) {
  var names = Object.keys(ASSETS), loaded = 0;
  names.forEach(function (n) {
    var im = new Image();
    im.onload = function () { loaded++; if (loaded === names.length) next(); };
    im.src = ASSETS[n];
    SPR[n] = im;
  });
}

function spr(name) { return SPR[name]; }

function darknessAt(x, y) {
  // 0 = bright meadow, up to 0.82 deep gloom
  var d = euc(x, y, HOME.x, HOME.y);
  var v = 0;
  if (d < 8) v = 0; else if (d < 13) v = (d - 8) / 5 * 0.45; else v = 0.45 + Math.min((d - 13) / 8, 1) * 0.37;
  // cave area is darkest
  var dc = euc(x, y, 40, 7);
  if (dc < 7) v = Math.max(v, 0.82 - dc * 0.04);
  return Math.min(v, 0.85);
}

function worldToScreen(wx, wy) {
  return [Math.round((wx * TS) - camX), Math.round((wy * TS) - camY)];
}

function draw() {
  var W = canvas.width, H = canvas.height;
  // camera centered on player
  camX = player.x * TS - W / 2; camY = player.y * TS - H / 2;
  camX = clamp(camX, 0, MAPW * TS - W); camY = clamp(camY, 0, MAPH * TS - H);
  var x0 = Math.floor(camX / TS) - 1, y0 = Math.floor(camY / TS) - 1;
  var x1 = x0 + Math.ceil(W / TS) + 2, y1 = y0 + Math.ceil(H / TS) + 2;
  // terrain
  for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
    if (!inMap(x, y)) continue;
    var t = TERR_IMG[terrainAt(x, y)];
    ctx.drawImage(SPR[t], Math.round(x * TS - camX), Math.round(y * TS - camY), TS, TS);
  }
  // gather drawable objects (y-sorted with player)
  var drawables = [];
  for (var i = 0; i < objects.length; i++) {
    var o = objects[i];
    if (o.dead && !(o.respawn > 0)) continue;
    if (o.x < x0 - 2 || o.x > x1 + 2 || o.y < y0 - 3 || o.y > y1 + 3) continue;
    drawables.push(o);
  }
  var petP = activePetData();
  var me = { type: "_player", x: Math.floor(player.x), y: Math.floor(player.y) };
  if (petP) drawables.push({ type: "_pet", x: player.x, y: player.y, pet: petP });
  drawables.push(me);
  drawables.sort(function (a, b) { return a.y - b.y; });
  for (var d = 0; d < drawables.length; d++) {
    var ob = drawables[d];
    drawObj(ob);
  }
  // action progress bar
  if (player.action) {
    var o2 = objById(player.action.objId);
    if (o2) {
      var p = clamp(player.action.t / player.action.dur, 0, 1);
      var sx = Math.round(o2.x * TS - camX), sy = Math.round(o2.y * TS - camY);
      ctx.fillStyle = "rgba(20,24,20,0.75)";
      ctx.fillRect(sx + 6, sy - 12, TS - 12, 7);
      ctx.fillStyle = "#7bc96f";
      ctx.fillRect(sx + 7, sy - 11, (TS - 14) * p, 5);
      ctx.fillStyle = "#fff"; ctx.font = "8px monospace";
      ctx.fillText(ACTION_DEFS[player.action.type].verb, sx + 2, sy - 16);
    }
  }
  // floats
  for (var f = 0; f < floats.length; f++) {
    var fl = floats[f];
    var fx = Math.round(fl.x * TS - camX), fy = Math.round((fl.y + (1 - fl.t / 1.2) * -0.6) * TS - camY);
    ctx.globalAlpha = clamp(fl.t / 0.4, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.font = "bold 11px monospace";
    ctx.fillText(fl.text, fx + 1, fy + 1);
    ctx.fillStyle = fl.color; ctx.fillText(fl.text, fx, fy);
    ctx.globalAlpha = 1;
  }
  // darkness overlay, tile-by-tile (cheap: per tile alpha)
  for (var y2 = y0; y2 <= y1; y2++) for (var x2 = x0; x2 <= x1; x2++) {
    if (!inMap(x2, y2)) continue;
    var dk = darknessAt(x2 + 0.5, y2 + 0.5);
    if (dk > 0.01) {
      ctx.fillStyle = "rgba(10,12,28," + dk.toFixed(2) + ")";
      ctx.fillRect(Math.round(x2 * TS - camX), Math.round(y2 * TS - camY), TS, TS);
    }
  }
  // torch glow around player at night/dark
  var dkP = darknessAt(player.x, player.y);
  if (dkP > 0.15) {
    var px = Math.round(player.x * TS - camX), py = Math.round(player.y * TS - camY);
    var g = ctx.createRadialGradient(px, py, TS * 0.6, px, py, TS * 3.2);
    g.addColorStop(0, "rgba(255,220,150,0.14)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(px - TS * 3.4, py - TS * 3.4, TS * 6.8, TS * 6.8);
  }
  // click marker
  if (marker.t > 0) {
    marker.t -= 0.016;
    var mx = Math.round(marker.x * TS - camX), my = Math.round(marker.y * TS - camY);
    ctx.strokeStyle = "rgba(255,255,255," + clamp(marker.t, 0, 1) + ")";
    ctx.strokeRect(mx + 4, my + 4, TS - 8, TS - 8);
  }
  // enemy hp bars
  for (var e2 = 0; e2 < objects.length; e2++) {
    var en = objects[e2];
    if (en.type !== "enemy" || en.dead) continue;
    if (en.hp < en.maxhp || en.aggro) {
      var esx = Math.round(en.x * TS - camX), esy = Math.round(en.y * TS - camY) - 10;
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(esx + 2, esy, TS - 4, 5);
      ctx.fillStyle = en.boss ? "#c07be0" : "#e05a5a";
      ctx.fillRect(esx + 3, esy + 1, (TS - 6) * clamp(en.hp / en.maxhp, 0, 1), 3);
    }
  }
}

function drawObj(o) {
  var name = null;
  switch (o.type) {
    case "tree": name = o.dark ? "treed" : "tree"; break;
    case "stump": name = "stump"; break;
    case "rock": name = "rock"; break;
    case "berrybush": name = "berry"; break;
    case "digspot": name = "dirtspot"; break;
    case "fishspot": {
      var fsx = Math.round(o.x * TS - camX), fsy = Math.round(o.y * TS - camY);
      ctx.drawImage(SPR["water"], fsx, fsy, TS, TS);
      ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(fsx + TS / 2, fsy + TS / 2, TS * 0.22, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(fsx + TS / 2, fsy + TS / 2, TS * 0.32, 0.3, 2.2); ctx.stroke();
      return; }
    case "farmplot": {
      var fpx = Math.round(o.x * TS - camX), fpy = Math.round(o.y * TS - camY);
      ctx.drawImage(SPR["tilled"], fpx, fpy, TS, TS);
      if (o.crop === "wheat" && !o.dead) {
        ctx.drawImage(SPR["wheat" + wheatStage(o)], fpx, fpy, TS, TS);
      } else {
        ctx.fillStyle = "rgba(90,60,40,0.55)";
        ctx.fillRect(fpx + TS * 0.35, fpy + TS * 0.35, TS * 0.3, TS * 0.3);
      }
      return; }
    case "tent": name = "tent"; break;
    case "campfire": name = "campfire"; break;
    case "storage": name = "store_chest"; break;
    case "gearchest": name = "gear_chest"; break;
    case "board": name = "blueprint"; break;
    case "workbench": name = "workbench"; break;
    case "petpen": name = "pet_pen"; break;
    case "hut": name = "hut"; break;
    case "cave": name = "cave"; break;
    case "npc": name = NPCS[o.npc].spr; break;
    case "enemy": name = o.stats.spr; break;
    case "coin": name = "coin"; break;
    case "mushroom": name = "mushroom"; break;
    case "note": name = "note"; break;
    case "chest": name = o.opened ? "store_chest" : "gear_chest"; break;
    case "_player": {
      var sxp = Math.round(player.x * TS - camX - SPR["player"].width * SCALE / 2);
      var syp = Math.round(player.y * TS - camY + TS / 2 - SPR["player"].height * SCALE) - 6;
      if (player.moving) syp += Math.sin(gameTime * 14) < 0 ? 1 : 0;
      ctx.drawImage(SPR["player"], sxp, syp, SPR["player"].width * SCALE, SPR["player"].height * SCALE);
      return; }
    case "_pet": {
      var p = o.pet, ps = PETS[p.kind].spr;
      var px = player.x - player.facing * 0.9, py = player.y + 0.1;
      var sx2 = Math.round(px * TS - camX - SPR[ps].width * SCALE / 2);
      var sy2 = Math.round(py * TS - camY + TS / 2 - SPR[ps].height * SCALE);
      ctx.drawImage(SPR[ps], sx2, sy2, SPR[ps].width * SCALE, SPR[ps].height * SCALE);
      return; }
  }
  if (!name || o.dead || o.taken) return;
  var im = SPR[name];
  if (!im) return;
  var dx0 = Math.round(o.x * TS - camX + (TS - im.width * SCALE) / 2);
  var dy0 = Math.round(o.y * TS - camY + TS - im.height * SCALE);
  ctx.drawImage(im, dx0, dy0, im.width * SCALE, im.height * SCALE);
  if (o.hurtFlash > 0) { ctx.globalAlpha = 0.45; ctx.fillStyle = "#fff"; ctx.fillRect(dx0, dy0, im.width * SCALE, im.height * SCALE); ctx.globalAlpha = 1; }
}
function wheatStage(o) {
  var age = (now() - o.planted) / 1000;
  if (age > 150) return 2; else if (age > 75) return 1; return 0;
}
function floatText(x, y, text, color) { floats.push({ x: x, y: y, text: text, color: color, t: 1.2 }); }

// ---------- input ----------
var marker = { x: 0, y: 0, t: 0 };
var QUEUED = null; // click target pending arrival {objId or tile}
function onClick(ev) {
  ev.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var sxp = (ev.clientX - rect.left) * (canvas.width / rect.width);
  var syp = (ev.clientY - rect.top) * (canvas.height / rect.height);
  var wx = Math.floor((sxp + camX) / TS), wy = Math.floor((syp + camY) / TS);
  if (!inMap(wx, wy)) return;
  marker.x = wx; marker.y = wy; marker.t = 0.5;
  var o = objAt(wx, wy);
  // enemy can be attacked while adjacent; click enemy anywhere
  if (o && o.type === "enemy" && !o.dead) { QUEUED = { kind: "attack", objId: o.id }; }
  else if (o && interactiveType(o)) { QUEUED = { kind: "interact", objId: o.id }; }
  else { QUEUED = { kind: "walk", x: wx, y: wy }; }
  processQueued();
}
function interactiveType(o) {
  switch (o.type) {
    case "tree": return "chop";
    case "rock": return "mine";
    case "digspot": return "dig";
    case "berrybush": return "pick";
    case "fishspot": return "fish";
    case "farmplot": return o.crop === "wheat" && wheatStage(o) === 2 ? "harvest" : (o.crop ? null : "plant");
    case "campfire": return "cook";
    case "chest": return "open";
    case "coin": return "collect";
    case "mushroom": return "collect";
    case "note": return "collect";
    case "npc": return "talk";
    case "storage": return "storage";
    case "gearchest": return "gear";
    case "board": return "board";
    case "workbench": return "workbench";
    case "petpen": return "pets";
    case "hut": return "hut";
    case "tent": return "rest";
    case "cave": return "cave";
  }
  return null;
}
function processQueued() {
  if (!QUEUED) return;
  var pq = QUEUED;
  if (pq.kind === "walk") {
    var p = findPath(Math.floor(player.x), Math.floor(player.y), pq.x, pq.y);
    if (p) { player.path = p; player.moving = true; }
    QUEUED = null; return;
  }
  var o = objById(pq.objId);
  if (!o || o.dead) { QUEUED = null; return; }
  if (adjacentTo(player.x, player.y, o.x, o.y)) { actOn(o, pq.kind); QUEUED = null; return; }
  var p2 = nearestAdjacent(o.x, o.y);
  if (!p2) { toast("Can't reach that.", "warn"); QUEUED = null; return; }
  player.path = p2; player.moving = true;   // keep QUEUED for arrival
}
function actOn(o, kind) {
  var it = interactiveType(o);
  if (kind === "attack") { player.attackTarget = o.id; attackEnemy(o); player.atkCd = 0.9; return; }
  switch (it) {
    case "chop": case "mine": case "dig": case "pick": case "fish": case "plant": case "harvest": case "open":
      startAction(o, it); break;
    case "cook": openCookMenu(o); break;
    case "collect":
      if (o.type === "coin") { player.coins++; player.collect.coins++; o.dead = true; toast("Ancient coin found! " + player.collect.coins + "/5", "loot"); }
      if (o.type === "mushroom") { bagAdd("mushroom", 1); player.collect.mushrooms++; o.dead = true; toast("Glowcap mushroom pocketed (" + player.collect.mushrooms + "/8)", "item"); }
      if (o.type === "note") { if (player.collect.notes.indexOf(o.noteIdx) < 0) { player.collect.notes.push(o.noteIdx); showNote(o.noteIdx); } o.dead = true; }
      break;
    case "talk": openNpcDialog(o); break;
    case "storage": openStorageUI(); break;
    case "gear": openGearChestUI(); break;
    case "board": openBuildUI(); break;
    case "workbench": toast("The workbench hums. Crafting comes to Bright Hollow soon.", "info"); break;
    case "pets": openPetsUI(); break;
    case "hut": toast("Home. It smells like wood smoke and good things to come.", "info"); break;
    case "rest": heal(player.maxhp); toast("You nap in the shade. Fully rested.", "info"); break;
    case "cave": toast("The cave mouth breathes cold air. Something big waits below... (deep dungeon coming)", "warn"); break;
  }
}
function showNote(idx) {
  var n = NOTES[idx];
  openModal("<h3>Weathered page</h3><p class='lore'>" + n + "</p><button class='btn' data-x='1'>Put it away</button>", function (r) {
    r.querySelector("[data-x]").onclick = closeModal;
  });

// ---------- movement ----------
function moveTick(dt) {
  if (player.action) {
    player.action.t += dt;
    if (player.action.t >= player.action.dur) { var a = player.action; player.action = null; finishAction(a); }
    return;
  }
  if (player.atkCd > 0) player.atkCd -= dt;
  if (!player.action && player.atkCd <= 0 && player.attackTarget) {
    var te = objById(player.attackTarget);
    if (te && te.type === "enemy" && !te.dead) {
      if (adjacentTo(player.x, player.y, te.x, te.y)) { attackEnemy(te); player.atkCd = 0.9; }
    } else player.attackTarget = null;
  }
  if (!player.moving || !player.path.length) { player.moving = false; return; }
  var spd = 2.1 * speedMult();   // tiles per second
  var target = player.path[0];
  var txp = target[0] + 0.5, typ = target[1] + 0.5;
  var dx = txp - player.x, dy = typ - player.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d <= spd * dt) {
    player.x = txp; player.y = typ;
    player.path.shift();
    if (!player.path.length) {
      player.moving = false;
      if (QUEUED) processQueued();
    }
  } else {
    player.x += dx / d * spd * dt; player.y += dy / d * spd * dt;
    player.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : -1) : player.facing;
  }
}

// ---------- respawn ticks ----------
function respawnTick() {
  for (var i = 0; i < objects.length; i++) {
    var o = objects[i];
    if (o.dead && o.respawn && now() > o.respawn) {
      o.dead = false;
      if (o.type === "tree") { o.hp = 3; blocked[tIdx(o.x, o.y)] = true; }
      if (o.type === "rock") { o.hp = 3; blocked[tIdx(o.x, o.y)] = true; }
      if (o.type === "enemy") { o.hp = o.maxhp; }
      o.respawn = 0;
    }
  }
}

  openModal(html, function (root) {
    var qa = root.querySelector("[data-qa]"); if (qa) qa.onclick = function () { player.quests[npc.quest] = "active"; toast("Quest accepted: " + q.name, "quest"); updateHud(); closeModal(); };
    var qt = root.querySelector("[data-qt]"); if (qt) qt.onclick = function () { turnInQuest(npc.quest); closeModal(); };
  });
}
function openBuildUI() {
  var html = "<h3>Blueprint Board</h3><div class='sub'>Build what the camp needs. Materials come from bag and storage.</div>";
  BUILDS.forEach(function (b) {
    var cost = Object.keys(b.cost).map(function (k) { return b.cost[k] + " " + MAT_LABEL[k]; }).join(", ");
    var done = BUILT.indexOf(b.id) >= 0 && b.id !== "plot" && b.id !== "storage";
    html += "<div class='row'><span><b>" + b.name + "</b> <span class='sub'>(" + cost + ")</span><br><span class='sub'>" + b.desc + "</span></span>" +
      "<button class='btn" + (done ? " off" : "") + "' data-b='" + b.id + "'>" + (done ? "Built" : "Build") + "</button></div>";
  });
  openModal(html, function (root) {
    root.querySelectorAll("[data-b]").forEach(function (b) { b.onclick = function () { placeBuild(b.getAttribute("data-b")); }; });
  });
}

// ---------- toasts ----------
function toast(msg, kind) {
  var t = el("div", "toast " + (kind || ""), msg);
  toastsEl.appendChild(t);

}
function resize() {
  canvas.width = Math.max(320, Math.floor(window.innerWidth));
  canvas.height = Math.max(320, Math.floor(window.innerHeight));
  canvas.style.width = "100%"; canvas.style.height = "100%";
}
window.addEventListener("resize", resize);

var lastT = 0;
function loop(t) {
  try {
    var dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    gameTime += dt * 1000;
    moveTick(dt);
    enemyTurn(dt);
    petTick(dt);
    for (var i = floats.length - 1; i >= 0; i--) { floats[i].t -= dt; if (floats[i].t <= 0) floats.splice(i, 1); }
    draw();
  } catch (err) {
    var d = document.getElementById("help");
    d.style.background = "#5a1a1a"; d.style.color = "#ffd";
    d.textContent = "ERR: " + err.message + " :: " + String(err.stack || "").split("\n").slice(0, 3).join(" | ");
    console.error(err);
    return;
  }
  requestAnimationFrame(loop);
}
function bindUi() {
  canvas.addEventListener("pointerdown", onClick);
  document.getElementById("bagbtn").onclick = openBagUI;
  document.getElementById("gearbtn").onclick = openGearUI;
  document.getElementById("skillsbtn").onclick = openSkillsUI;
  document.getElementById("savebtn").onclick = function () { saveGame(); toast("Saved", "item"); };
}
function init() {
  canvas = document.getElementById("game");
  ctx = canvas.getContext("2d");
  modalEl = document.getElementById("modal");
  toastsEl = document.getElementById("toasts");
  resize();
  var hadSave = loadGame();
  if (!hadSave) {
    genMap(); placeWorld();
    // starter gear
    player.equipment = { weapon: null, head: null, chest: null, legs: null, gloves: null, boots: null, shield: null };
    player.inv.seeds = 3;
    toast("Welcome to Bright Hollow. Click anywhere to walk; click things to use them.", "info");
    setTimeout(function () { toast("Talk to Elder Rowan by the fire to start.", "quest"); }, 2500);
  } else {
    toast("Welcome back. The campfire kept burning.", "info");
  }
  updateHud();
  bindUi();
  loadSprites(function () { requestAnimationFrame(loop); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

</script>
</body>
</html>
